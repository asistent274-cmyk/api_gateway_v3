      <!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Chatbot API Gateway</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; background: #111; color: #eee; }
  h1 { font-size: 1.3rem; }
  input, button { width: 100%; padding: 10px; margin: 6px 0; font-size: 1rem; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; }
  input { background: #222; color: #eee; }
  button { background: #4a7dff; color: white; border: none; cursor: pointer; }
  .key-card { background: #1e1e1e; padding: 12px; border-radius: 8px; margin: 10px 0; }
  .key-value { font-family: monospace; font-size: 0.85rem; word-break: break-all; background: #000; padding: 6px; border-radius: 4px; margin: 6px 0; }
  .label { font-weight: bold; }
  .plan-owner { color: #4caf50; }
  small { color: #999; }
</style>
</head>
<body>
  <h1>🔑 Mein Chatbot API Gateway</h1>

  <div id="signup-section">
    <p>Mit E-Mail registrieren, um deinen persönlichen API-Key zu bekommen:</p>
    <input id="email-input" type="email" placeholder="deine-email@example.com">
    <button onclick="signup()">Account anlegen</button>
    <p><small>Schon registriert? <a href="#" onclick="showLookup(); return false;" style="color:#4a7dff;">Key erneut abrufen</a></small></p>
    <div id="lookup-section" style="display:none;">
      <input id="lookup-key-input" type="text" placeholder="Deinen API-Key hier einfügen">
      <button onclick="lookup()">Status anzeigen</button>
    </div>
  </div>

  <div id="result-section" style="display:none;">
    <div class="key-card">
      <div class="label">E-Mail: <span id="res-email"></span></div>
      <div class="label">Tarif: <span id="res-tier"></span></div>
      <div class="key-value" id="res-key"></div>
      <small id="res-usage"></small>
    </div>
    <p><small>⚠️ Speicher dir den Key jetzt -- er wird nicht nochmal angezeigt, wenn du ihn verlierst, brauchst du ihn zum erneuten Abrufen des Status.</small></p>
    <button onclick="reset()" style="background:#444;">Zurück</button>
  </div>

  <script>
    async function signup() {
      const email = document.getElementById('email-input').value.trim().toLowerCase();
      if (!email) return;
      try {
        const res = await fetch('/signup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email})
        });
        const data = await res.json();
        if (!res.ok) { alert(data.detail || 'Fehler beim Anlegen'); return; }
        showResult(data.email, data.tier, data.api_key, `Tageslimit: ${data.daily_limit === null ? 'unbegrenzt' : data.daily_limit}`);
      } catch (e) {
        alert('Fehler: ' + e.message);
      }
    }

    function showLookup() {
      document.getElementById('lookup-section').style.display = 'block';
    }

    async function lookup() {
      const key = document.getElementById('lookup-key-input').value.trim();
      if (!key) return;
      try {
        const res = await fetch('/me', {
          headers: {'X-API-Key': key}
        });
        const data = await res.json();
        if (!res.ok) { alert(data.detail || 'Key ungültig'); return; }
        showResult(data.email, data.tier, key, `${data.requests_used} genutzt, ${data.remaining === null ? 'unbegrenzt' : data.remaining + ' übrig'} heute`);
      } catch (e) {
        alert('Fehler: ' + e.message);
      }
    }

    function showResult(email, tier, key, usageText) {
      document.getElementById('signup-section').style.display = 'none';
      document.getElementById('result-section').style.display = 'block';
      document.getElementById('res-email').textContent = email;
      document.getElementById('res-tier').textContent = tier;
      document.getElementById('res-tier').className = tier === 'owner' ? 'plan-owner' : '';
      document.getElementById('res-key').textContent = key;
      document.getElementById('res-usage').textContent = usageText;
    }

    function reset() {
      document.getElementById('signup-section').style.display = 'block';
      document.getElementById('result-section').style.display = 'none';
      document.getElementById('email-input').value = '';
      document.getElementById('lookup-key-input').value = '';
    }
  </script>
</body>
</html>
